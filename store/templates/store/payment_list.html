{% extends 'base.html' %}

{% block title %}Payment List{% endblock %}

{% block content %}
  <h2>Payments</h2>
  <ul class="list-group">
    {% for payment in object_list %}
      <li class="list-group-item">
        <a style="text-decoration: none", href="{% url 'payment_detail' payment.pk %}">Payment #{{ payment.pk }}</a>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
