{% extends 'base.html' %}

{% block title %}Restaurant List{% endblock %}

{% block content %}
  <h2>Restaurants</h2>
  <ul class="list-group">
    {% for restaurant in object_list %}
      <li class="list-group-item">
        <a style="text-decoration: none", href="{% url 'restaurant_detail' restaurant.pk %}">{{ restaurant.name }}</a>
      </li>
    {% endfor %}
  </ul>
  <a class="btn btn-primary mt-3" href="{% url 'restaurant_create' %}">Add Restaurant</a>
{% endblock %}
