{% extends 'base.html' %}

{% block title %}Dish List{% endblock %}

{% block content %}
  <h2>Dishes</h2>
  <ul class="list-group">
    {% for dish in object_list %}
      <li class="list-group-item">
        <a style="text-decoration: none", href="{% url 'dish_detail' dish.pk %}">{{ dish.name }}</a>
      </li>
    {% endfor %}
  </ul>
  <a class="btn btn-primary mt-3" href="{% url 'dish_create' %}">Add Dish</a>
{% endblock %}
