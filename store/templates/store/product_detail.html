{% extends 'base.html' %}

{% block title %}{{ object.name }}{% endblock %}

{% block content %}
  <h2>{{ object.name }}</h2>
  <p>{{ object.description }}</p>
  <p>Price: {{ object.price }}</p>
  <p>Available: {{ object.is_available }}</p>
  <a class="btn btn-secondary" href="{% url 'product_update' object.pk %}">Edit</a>
  <a class="btn btn-danger" href="{% url 'product_delete' object.pk %}">Delete</a>
  <a class="btn btn-primary" href="{% url 'product_list' %}">Back to List</a>
{% endblock %}
