{% extends 'base.html' %}

{% block title %}Payment #{{ object.pk }}{% endblock %}

{% block content %}
  <h2>Payment {{ object.pk }}</h2>
  <p>Order: {{ object.order.id }}</p>
  <p>Amount: {{ object.amount }}</p>
  <p>Status: {{ object.get_status_display }}</p>
  <a class="btn btn-secondary" href="{% url 'payment_list' %}">Back to List</a>
{% endblock %}
