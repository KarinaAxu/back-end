{% extends 'base.html' %}

{% block title %}Confirm Deletion{% endblock %}

{% block content %}
  <h2>Are you sure you want to delete "{{ object.name }}"?</h2>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm</button>
    <a class="btn btn-secondary" href="{% url 'restaurant_list' %}">Cancel</a>
  </form>
{% endblock %}
