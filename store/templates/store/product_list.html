{% extends 'base.html' %}

{% block title %}Product List{% endblock %}

{% block content %}
  <h2>Products</h2>
  <ul class="list-group">
    {% for product in object_list %}
      <li class="list-group-item">
        <a href="{% url 'product_detail' product.pk %}">{{ product.name }}</a>
      </li>
    {% endfor %}
  </ul>
  <a class="btn btn-primary mt-3" href="{% url 'product_create' %}">Add Product</a>
{% endblock %}
